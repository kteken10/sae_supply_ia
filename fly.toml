# Configuration Fly.io de l'API backend SAE Carrefour.
# https://fly.io/docs/reference/configuration/

app = "sae-supply-ia-api"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  CORS_ORIGINS = "https://sae.dissangkevin.work"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # eteint la machine apres inactivite (free tier friendly)
  auto_start_machines = true    # rallume au prochain hit
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  protocol = "http"
  timeout = "5s"

[[mounts]]
  source = "audit_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
